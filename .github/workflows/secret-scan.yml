# TruffleHog OSS secret scan on a GitHub-hosted runner (ubuntu-24.04): a PR scans its commits (base..head), a push to main scans
# the pushed commits. Fails on verified or unknown-verification findings. Advisory: not a required gate in
# agents/repository_guardian.yaml. No production secrets, deploy permissions, or write token.
name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # TruffleHog scans git history between base and head
          persist-credentials: false
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # The action defaults to the unpinned `latest` image; pin the scanner image by digest too.
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          extra_args: --results=verified,unknown
