# Workflow security and correctness on a GitHub-hosted runner (ubuntu-24.04):
# - zizmor: template injection, excessive permissions, credential persistence, unpinned actions;
# - actionlint: invalid YAML, expressions, job dependencies and embedded shell (shellcheck).
# Runs when workflows change. Advisory: a red check is not a required gate in
# agents/repository_guardian.yaml. Read-only token (zizmor's online audits only read public action data);
# no other secrets; no SARIF upload (Code Scanning is not on this plan).
name: workflow-lint

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let scanner containers read the checkout
        # Scanner containers may use a different UID; grant read access to this credential-free checkout.
        run: chmod -R a+rX "$GITHUB_WORKSPACE"
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1  # the action maps this to a pinned image digest
          advanced-security: false
          annotations: true
      - name: actionlint
        if: ${{ !cancelled() }}  # report both tools even when zizmor has findings
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
