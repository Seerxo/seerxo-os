name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problems: do not use this form. See SECURITY.md and report privately."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit SHA you tested.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any secret, token, address or personal data before pasting.
      render: text
