# Stage C coder egress (docs/CODER_RUNTIME.md D3). Default deny: only hosts in the
# allowlist, only CONNECT to 443. Reachable only from the internal coder-net network.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 8
LogLevel Connect
DisableViaHeader Yes
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
