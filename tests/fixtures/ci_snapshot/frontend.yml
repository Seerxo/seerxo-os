# Founder Desk frontend tests on a GitHub-hosted runner (ubuntu-24.04). agents/repository_guardian.yaml lists this path,
# so the merge gates require its pull_request
# run on the PR head and post-merge verification, Guardian and the deploy ci-gate require its push run on
# the exact main commit. No production secrets, deploy permissions, or write token.
name: frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new PR push supersedes the old run; each main commit keeps its own run (deploy evidence).
  group: frontend-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desk/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix desk
      - name: Build Founder Desk
        run: npm run build --prefix desk
      - name: Verify committed production assets
        run: |
          git diff --exit-code -- app/static
          test -z "$(git ls-files --others --exclude-standard -- app/static)"
      - name: Founder Desk unit tests
        run: npm test --prefix desk
      - name: Founder Desk lint
        run: npm run lint --prefix desk
