<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#11151b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEZ" />
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>SEZ Company</title>
    <script>
      /* Apply the saved theme before first paint (no light/dark flash). Mirrors src/lib/theme.ts. */
      try {
        var t = localStorage.getItem("founder-desk-theme")
        var dark = t === "dark" || (t !== "light" && !matchMedia("(prefers-color-scheme: light)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
